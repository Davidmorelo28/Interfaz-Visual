<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reporte Hidrometeorológico Semanal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f0f4f8; color: #000; padding: 20px; }
    .header { text-align: center; margin-bottom: 24px; }
    .header h2 { font-size: 22px; font-weight: bold; }
    .header p { font-size: 13px; color: #444; margin-top: 4px; }
    .slider-root { max-width: 520px; margin: 0 auto; padding: 1.5rem 0; }
    .track { overflow: hidden; border-radius: 12px; border: 0.5px solid #ddd; background: #fff; }
    .slides-wrap { display: flex; transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1); }
    .panel { min-width: 100%; padding: 2.5rem 2rem; display: flex; flex-direction: column; gap: 1rem; }
    .panel-tag { font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 10px; border-radius: 20px; align-self: flex-start; }
    .panel-num { font-size: 56px; font-weight: 500; line-height: 1; }
    .panel-title { font-size: 18px; font-weight: 600; }
    .data-row { display: flex; justify-content: space-between; font-size: 14px; padding: 6px 0; border-bottom: 1px solid #f0f0f0; }
    .data-row:last-child { border-bottom: none; }
    .data-label { color: #666; }
    .data-value { font-weight: 600; color: #111; }
    .nav { display: flex; align-items: center; justify-content: space-between; margin-top: 1.25rem; }
    .nav-btn { display: flex; align-items: center; gap: 6px; padding: 8px 18px; border: 0.5px solid #ccc; border-radius: 8px; background: #fff; color: #111; font-size: 13px; cursor: pointer; transition: background 0.15s; }
    .nav-btn:hover { background: #f5f5f5; }
    .nav-btn:disabled { opacity: 0.3; cursor: default; }
    .dots { display: flex; gap: 7px; align-items: center; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #ccc; border: none; padding: 0; cursor: pointer; transition: all 0.25s; }
    .dot.active { width: 22px; border-radius: 4px; }
    .p1 .panel-num { color: #1D9E75; } .p1 .dot.active { background: #1D9E75; } .p1 .panel-tag { background: #E1F5EE; color: #0F6E56; }
    .p2 .panel-num { color: #7F77DD; } .p2 .dot.active { background: #7F77DD; } .p2 .panel-tag { background: #EEEDFE; color: #3C3489; }
    .p3 .panel-num { color: #D85A30; } .p3 .dot.active { background: #D85A30; } .p3 .panel-tag { background: #FAECE7; color: #712B13; }
    .p4 .panel-num { color: #D4537E; } .p4 .dot.active { background: #D4537E; } .p4 .panel-tag { background: #FBEAF0; color: #72243E; }
    .p5 .panel-num { color: #378ADD; } .p5 .dot.active { background: #378ADD; } .p5 .panel-tag { background: #E6F1FB; color: #0C447C; }
    .p6 .panel-num { color: #BA7517; } .p6 .dot.active { background: #BA7517; } .p6 .panel-tag { background: #FAEEDA; color: #633806; }
    .p7 .panel-num { color: #2470e0; } .p7 .dot.active { background: #2470e0; } .p7 .panel-tag { background: #e6f0ff; color: #0a3d8f; }
  </style>
</head>
<body>

  <div class="header">
    <h2>Reporte Hidrometeorológico Semanal</h2>
    <p>Río Sinú — Lorica, Córdoba, Colombia</p>
  </div>

  <div class="slider-root" id="root">
    <div class="track">
      <div class="slides-wrap" id="wrap">

        <div class="panel p1">
          <span class="panel-tag">Día 1</span>
          <span class="panel-num">01</span>
          <p class="panel-title" id="titulo-1"></p>
          <div id="datos-1"></div>
        </div>

        <div class="panel p2">
          <span class="panel-tag">Día 2</span>
          <span class="panel-num">02</span>
          <p class="panel-title" id="titulo-2"></p>
          <div id="datos-2"></div>
        </div>

        <div class="panel p3">
          <span class="panel-tag">Día 3</span>
          <span class="panel-num">03</span>
          <p class="panel-title" id="titulo-3"></p>
          <div id="datos-3"></div>
        </div>

        <div class="panel p4">
          <span class="panel-tag">Día 4</span>
          <span class="panel-num">04</span>
          <p class="panel-title" id="titulo-4"></p>
          <div id="datos-4"></div>
        </div>

        <div class="panel p5">
          <span class="panel-tag">Día 5</span>
          <span class="panel-num">05</span>
          <p class="panel-title" id="titulo-5"></p>
          <div id="datos-5"></div>
        </div>

        <div class="panel p6">
          <span class="panel-tag">Día 6</span>
          <span class="panel-num">06</span>
          <p class="panel-title" id="titulo-6"></p>
          <div id="datos-6"></div>
        </div>

        <div class="panel p7">
          <span class="panel-tag">Día 7</span>
          <span class="panel-num">07</span>
          <p class="panel-title" id="titulo-7"></p>
          <div id="datos-7"></div>
        </div>

      </div>
    </div>

    <div class="nav" id="nav">
      <button class="nav-btn" id="btn-prev" disabled>
        <i class="ti ti-arrow-left"></i> Anterior
      </button>
      <div class="dots" id="dots"></div>
      <button class="nav-btn" id="btn-next">
        Siguiente <i class="ti ti-arrow-right"></i>
      </button>
    </div>
  </div>

  <script>
    // ── DATOS DEL WEBHOOK ──────────────────────────────────────────
    // Reemplaza esta URL con tu webhook real de n8n
    const WEBHOOK_URL = 'https://n8n-hidro-sinu-hz1l.onrender.com/webhook/hidro-sinu';

    const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

    function formatFecha(offset) {
      const d = new Date();
      d.setDate(d.getDate() + offset);
      return `${d.getDate()} de ${meses[d.getMonth()]} de ${d.getFullYear()}`;
    }

    function renderDatos(containerId, tituloId, dia, offset) {
      document.getElementById(tituloId).textContent = formatFecha(offset);
      document.getElementById(containerId).innerHTML = `
        <div class="data-row"><span class="data-label">Estado del cielo</span><span class="data-value">${dia.weathercode}</span></div>
        <div class="data-row"><span class="data-label">Temperatura máxima</span><span class="data-value">${dia.temp_max}°C</span></div>
        <div class="data-row"><span class="data-label">Temperatura mínima</span><span class="data-value">${dia.temp_min}°C</span></div>
        <div class="data-row"><span class="data-label">Probabilidad de lluvia</span><span class="data-value">${dia.prob_lluvia}%</span></div>
        <div class="data-row"><span class="data-label">Viento</span><span class="data-value">${dia.viento_max} km/h</span></div>
      `;
    }

    async function cargarDatos() {
      try {
        const res = await fetch(WEBHOOK_URL);
        const data = await res.json();
        for (let i = 1; i <= 7; i++) {
          renderDatos(`datos-${i}`, `titulo-${i}`, data[`dia_${i}`], i);
        }
      } catch (e) {
        console.error('Error cargando datos:', e);
      }
    }

    cargarDatos();

    // ── SLIDER ─────────────────────────────────────────────────────
    const total = 7;
    let cur = 0;
    const wrap = document.getElementById('wrap');
    const prev = document.getElementById('btn-prev');
    const next = document.getElementById('btn-next');
    const dotsEl = document.getElementById('dots');
    const panelClasses = ['p1','p2','p3','p4','p5','p6','p7'];

    for (let i = 0; i < total; i++) {
      const d = document.createElement('button');
      d.className = 'dot' + (i === 0 ? ' active' : '');
      d.setAttribute('aria-label', 'Ir al panel ' + (i+1));
      d.addEventListener('click', () => go(i));
      dotsEl.appendChild(d);
    }

    function go(idx) {
      cur = idx;
      wrap.style.transform = 'translateX(-' + (cur * 100) + '%)';
      prev.disabled = cur === 0;
      next.disabled = cur === total - 1;
      document.querySelectorAll('.dot').forEach((d, i) => {
        d.className = 'dot' + (i === cur ? ' active' : '');
      });
      document.getElementById('nav').className = 'nav ' + panelClasses[cur];
    }

    prev.addEventListener('click', () => { if (cur > 0) go(cur - 1); });
    next.addEventListener('click', () => { if (cur < total - 1) go(cur + 1); });
    go(0);
  </script>

</body>
</html>
